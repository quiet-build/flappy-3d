name: Deploy arcade component

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: quiet-build/.github/.github/workflows/deploy-arcade-component.yml@8f75852775e54f88430743f90ef83ad1a936b14f
    with:
      support-sha: 8f75852775e54f88430743f90ef83ad1a936b14f
      game-id: flappy
      prebuild-command: "node --test tests/redirect.test.mjs && pnpm exec playwright test --config playwright.gameplay.config.ts"
      postbuild-command: "pnpm exec playwright test --config playwright.component.config.ts && PLAYWRIGHT_BASE_URL=http://127.0.0.1:5205/ pnpm exec playwright test tests/cream-ui.spec.ts tests/side-camera.spec.ts --config playwright.standalone.config.ts"
      pages-base: /flappy-3d/
      bundle-check-command: bash scripts/bundle-check.sh
      lighthouse-pwa-gate: '0.9'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
